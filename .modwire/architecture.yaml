boundaries:
  tags:
    - { name: technical, match: "*" }
    - { name: app, match: "src/enclosure/*", excluded_patterns: [src/enclosure/browser, src/enclosure/core, src/enclosure/plans, src/enclosure/shared, src/enclosure/__init__.py, src/enclosure/autowiring.py] }
    - { name: app_config, match: "src/enclosure/*/apps.py", excluded_patterns: [src/enclosure/browser, src/enclosure/core, src/enclosure/plans, src/enclosure/shared] }
    - { name: errors, match: "src/enclosure/*/errors.py", excluded_patterns: [src/enclosure/browser, src/enclosure/core, src/enclosure/plans, src/enclosure/shared] }
    - { name: models, match: "src/enclosure/*/models.py", excluded_patterns: [src/enclosure/browser, src/enclosure/core, src/enclosure/plans, src/enclosure/shared] }
    - { name: facade, match: "src/enclosure/*/services/facade.py" }
    - { name: repository, match: "src/enclosure/*/services/repository.py" }
    - { name: service_package, match: "src/enclosure/*/services/*", excluded_patterns: [src/enclosure/*/services/__init__.py, src/enclosure/*/services/facade.py, src/enclosure/*/services/repository.py] }
    - { name: api, match: "src/enclosure/*/api", excluded_patterns: [src/enclosure/browser, src/enclosure/core, src/enclosure/plans, src/enclosure/shared] }
  flow:
    module_tag: app
    layers: [api, facade, service_package, repository, models, errors]
    analyzers: [backward-flow, no-cycles, no-reentry]


shape:
  realms:
    - name: app-config
      match: "src/enclosure/*/apps.py"
      shape:
        max_classes_per_file: 1
        max_functions_per_file: 0
    - name: errors
      match: "src/enclosure/*/errors.py"
      shape:
        max_classes_per_file: -1
        max_functions_per_file: 0
    - name: models
      match: "src/enclosure/*/models.py"
      shape:
        max_classes_per_file: -1
        max_functions_per_file: 0
        allow_optional_class_properties: true
    - name: service-facade
      match: "src/enclosure/*/services/facade.py"
      shape:
        max_classes_per_file: 1
        max_functions_per_file: 0
        allow_optional_method_args: true
    - name: service-repository
      match: "src/enclosure/*/services/repository.py"
      shape:
        max_classes_per_file: 1
        max_functions_per_file: 0
        allow_optional_method_args: true
        allow_optional_class_properties: true
    - name: service-packages
      match: "src/enclosure/*/services/*"
      shape:
        max_classes_per_file: 1
        max_abstract_classes_per_file: -1
        max_functions_per_file: 0
        allow_import_aliases: true
        require_joined_imports: false
    - name: api-schemas
      match: "src/enclosure/*/api/schemas.py"
      shape:
        max_functions_per_file: 0
    - name: api-controllers
      match: "src/enclosure/*/api/controllers.py"
      shape:
        max_classes_per_file: -1
        max_types_per_file: -1
        max_abstract_classes_per_file: 1
        max_functions_per_file: 0
