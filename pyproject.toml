[project]
name = "enclosure"
version = "0.1.0"
description = "Enclosure runtime."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "copier>=9.16.0",
    "dj-database-url",
    "django",
    "django-cors-headers",
    "django-health-check",
    "django-model-utils",
    "django-ninja-extra",
    "gunicorn",
    "httpx",
    "mcp>=2,<3",
    "modwire-architecture>=7.0.0,<8",
    "modwire-cli>=2.0.0",
    "modwire-extraction==2.1.1",
    "modwire-hex",
    "modwire-mermaid>=1.0.1,<2",
    "modwire-siren==4.0.0",
    "pgvector",
    "psycopg[binary]",
    "pydantic",
    "pydantic-yaml>=1.7.0",
    "pygments",
    "python-dotenv",
    "pyyaml",
    "structlog",
    "uvicorn",
    "uvicorn-worker",
    "wireup",
    "whitenoise",
    "django-extensions>=4.1",
    "django-shortuuidfield>=0.1.3",
]

[dependency-groups]
dev = [
    "dirty-equals>=0.11",
    "openapi-python-client",
    "pytest",
    "pytest-django",
    "ruff",
]

[tool.uv]
package = false
cache-dir = ".dev/uv-cache"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "enclosure.core.settings"
cache_dir = ".dev/pytest-cache"
pythonpath = ["src", "."]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["src", "tests"]

[tool.ruff]
cache-dir = ".dev/ruff-cache"
extend-exclude = ["src/enclosure/plans", "src/enclosure/records"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "TID251", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]
"src/enclosure/core/settings.py" = ["E402"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"src.enclosure" = { msg = "Import application modules from 'enclosure', never from 'src.enclosure'." }

[tool.coverage.run]
data_file = ".dev/coverage"

[tool.mypy]
cache_dir = ".dev/mypy-cache"
