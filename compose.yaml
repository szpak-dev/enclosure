name: enclosure

x-runtime: &runtime
  image: ${ENCLOSURE_IMAGE:?Set ENCLOSURE_IMAGE to the published Docker Hub image and tag.}
  pull_policy: always
  environment:
    ALLOWED_HOSTS: localhost,127.0.0.1,enclosure-mcp
    DATABASE_HOST: resumed-db
    DATABASE_PORT: "5432"
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    DEBUG: "0"
    MODWIRE_CACHE_DIRECTORY: /var/cache/enclosure/modwire
    MODWIRE_CACHE_MAX_BYTES: ${MODWIRE_CACHE_MAX_BYTES:-1073741824}
    PROJECT_HEALTH_MAX_CONCURRENCY: ${PROJECT_HEALTH_MAX_CONCURRENCY:-1}
    PROJECT_HEALTH_TIMEOUT_SECONDS: ${PROJECT_HEALTH_TIMEOUT_SECONDS:-60}
    RECORDS_EMBEDDINGS_ENABLED: ${RECORDS_EMBEDDINGS_ENABLED:-1}
    RECORDS_EMBEDDING_PROVIDER: ${RECORDS_EMBEDDING_PROVIDER:-deterministic}
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  volumes:
    - type: volume
      source: modwire-cache
      target: /var/cache/enclosure/modwire
    - type: bind
      source: ${ENCLOSURE_PROJECTS_DIR:-/Users/gorky/Projects}
      target: ${ENCLOSURE_PROJECTS_DIR:-/Users/gorky/Projects}
      bind:
        create_host_path: false
  networks:
    - database

services:
  mcp:
    <<: *runtime
    container_name: enclosure-mcp
    ports:
      - "127.0.0.1:${ENCLOSURE_MCP_PORT:-8666}:8000"
    restart: always

  migrate:
    <<: *runtime
    profiles: [migration]
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

networks:
  database:
    external: true
    name: resumed-api_default

volumes:
  modwire-cache:
