name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: enclosure
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: enclosure

      - name: Check out local modwire-siren source
        uses: actions/checkout@v6
        with:
          repository: modwire/modwire-siren
          ref: v4.0.0
          path: modwire-siren

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: enclosure/browser/package-lock.json
          node-version: 24

      - name: Install Python
        run: uv python install 3.14

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install browser dependencies
        run: npm --prefix browser ci

      - name: Check
        run: make ci
