name: Publish Docker Hub image

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Dockerfile relative to the repository root.
        required: true
        type: string
      dockerhub-username:
        description: Docker Hub namespace that owns the target repository.
        required: true
        type: string
      image:
        description: Docker Hub repository without the docker.io prefix.
        required: true
        type: string
      release-tag:
        description: Canonical GitHub Release SemVer tag.
        required: true
        type: string
      stable-release:
        description: Whether this release may update the latest tag.
        required: true
        type: boolean
    secrets:
      DOCKERHUB_TOKEN:
        required: true
    outputs:
      digest:
        description: Published multi-platform manifest digest.
        value: ${{ jobs.publish.outputs.digest }}
      version:
        description: Canonical image version derived from the release tag.
        value: ${{ jobs.publish.outputs.version }}

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  publish:
    name: Publish ${{ inputs.image }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive release tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ inputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release-tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release-tag }}
            type=raw,value=latest,enable=${{ inputs.stable-release }}
            type=sha,prefix=sha-

      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ENCLOSURE_RUNTIME_VERSION=${{ steps.metadata.outputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }},timeout=2m,ignore-error=true
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: docker.io/${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
